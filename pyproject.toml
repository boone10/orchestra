[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.4.1"
description = "A small control plane that operates command-line agents"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.setuptools.packages.find]
include = ["orchestra*"]
